<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NUCLEO-H563ZI Web Control</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <header>
      <img src="/logo.jpg" alt="PR Tech Talk logo">
      <div><p class="eyebrow">STM32 · Mongoose</p><h1>NUCLEO-H563ZI</h1><p>Onboard controls</p></div>
    </header>
    <section class="panel" aria-labelledby="led-title">
      <div class="section-title"><h2 id="led-title">Onboard LEDs</h2><span id="connection" class="badge">Connecting…</span></div>
      <div class="led-grid">
        <article><span class="lamp green" id="lamp-1"></span><div><h3>Green LED</h3><p>LD1 · PB0</p></div><button id="led-1" type="button" aria-pressed="false">Turn on</button></article>
        <article><span class="lamp yellow" id="lamp-2"></span><div><h3>Yellow LED</h3><p>LD2 · PF4</p></div><button id="led-2" type="button" aria-pressed="false">Turn on</button></article>
        <article><span class="lamp red" id="lamp-3"></span><div><h3>Red LED</h3><p>LD3 · PG4</p></div><button id="led-3" type="button" aria-pressed="false">Turn on</button></article>
      </div>
    </section>
    <section class="panel button-panel" aria-labelledby="button-title">
      <div><p class="eyebrow">Live input</p><h2 id="button-title">User button</h2><p>Blue button · PC13</p></div>
      <div id="user-button" class="button-state" aria-live="polite"><span></span><strong>Released</strong></div>
    </section>
    <footer>DHCP · Plain HTTP · State refresh every 500 ms</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
